name: Release

# Two entry points, same result:
#   - pushing a v* tag (`git tag v0.8.0 && git push origin v0.8.0`), or
#   - dispatching the workflow with a `tag` input (for environments whose
#     git relay cannot push tags) — the create-release job then creates the
#     tag at the dispatched commit via the release API.
# Either way the create-release job creates the GitHub Release exactly once
# (five parallel matrix jobs each racing to create it could produce
# duplicates), and the matrix jobs only attach assets. Note: a tag created
# by the workflow's own token does not re-trigger tag-push workflows, so
# after a dispatch-mode release, dispatch the docker publish workflow at the
# new tag ref for the semver image tags.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.8.0), at the dispatched ref's commit"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release (and tag, in dispatch mode)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ inputs.tag || github.ref_name }}/CHANGELOG.md) for the curated changes in this release."

  release:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install NPM packages
        run: cd ui && npm ci

      - name: Build release binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          make build
          base="asynqmon_${TAG}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            # Windows binaries need the .exe suffix and land in a zip, not a
            # tarball of an extensionless PE file.
            mv asynqmon asynqmon.exe
            zip "${base}.zip" asynqmon.exe
            sha256sum "${base}.zip" > "${base}.zip.sha256"
          else
            tar -czvf "${base}.tar.gz" asynqmon
            sha256sum "${base}.tar.gz" > "${base}.tar.gz.sha256"
          fi
          ls -la

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            asynqmon_*.tar.gz
            asynqmon_*.zip
            asynqmon_*.sha256
