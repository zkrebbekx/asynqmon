name: CI
on:
  push:
    branches:
      - "master"
  pull_request:

# Least privilege for every job below. Nothing in CI writes to the repo.
permissions:
  contents: read

jobs:
  go:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    services:
      # The root-package suites are integration tests against a real Redis
      # (127.0.0.1:6379, DBs 4-15); without one they self-skip and CI would
      # green-light untested changes.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The toolchain that runs the tests must be the one the image ships.
      # Printing it makes drift between go.mod, CI and the Dockerfile visible
      # in the log.
      - name: Go version
        run: go version
      - name: Gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reports unformatted files — run 'gofmt -w .'"
            echo "$unformatted"
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  ui:
    name: UI lint, test, embedded-build drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Embedded build is in sync with ui/src
        # ui/build is committed because the Go binary embeds it (go:embed).
        # A src change without a rebuild ships a stale UI silently — this
        # already happened once (2f36d6b). The Vite build is deterministic
        # under npm ci, so any diff here means "run `make assets` and commit".
        run: |
          if [ -n "$(git status --porcelain -- build)" ]; then
            echo "::error::ui/build is out of sync with ui/src — run 'make assets' and commit the result."
            git status --porcelain -- build
            git diff --stat -- build | tail -5
            exit 1
          fi
      - name: Charts are code-split out of the entry chunk
        # recharts is the largest dependency. It must stay in its own lazily
        # loaded chunk, so index.html must not preload it. A stray static
        # import pulls it back into the entry graph and adds ~400 kB to the
        # first paint; this assertion fails the build when that happens.
        run: |
          if grep -q recharts build/index.html; then
            echo "::error::ui/build/index.html preloads recharts — a static import pulled the chart bundle into the entry chunk."
            grep -n recharts build/index.html
            exit 1
          fi

  helm:
    name: Helm chart lint and render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint chart
        run: helm lint --strict charts/asynqmon
      - name: Render value combinations
        run: ./scripts/helm-render-check.sh
