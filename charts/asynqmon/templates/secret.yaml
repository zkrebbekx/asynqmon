{{- if and .Values.redis.password (not .Values.redis.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-redis" (include "asynqmon.fullname" .) }}
  labels:
    {{- include "asynqmon.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.redis.existingSecretPasswordKey }}: {{ .Values.redis.password | b64enc | quote }}
{{- end }}
{{- $inlineSentinel := and .Values.redis.sentinelPassword (not .Values.redis.existingSecretSentinelPasswordKey) }}
{{- $inlineProm := and .Values.prometheus.basicAuth (not .Values.prometheus.existingSecret) }}
{{- $inlineHygiene := and .Values.hygiene.webhookUrl (not .Values.hygiene.existingSecret) }}
{{- if or $inlineSentinel $inlineProm $inlineHygiene }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "asynqmon.appSecretName" . }}
  labels:
    {{- include "asynqmon.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $inlineSentinel }}
  redis-sentinel-password: {{ .Values.redis.sentinelPassword | b64enc | quote }}
  {{- end }}
  {{- if $inlineProm }}
  prometheus-basic-auth: {{ .Values.prometheus.basicAuth | b64enc | quote }}
  {{- end }}
  {{- if $inlineHygiene }}
  hygiene-webhook-url: {{ .Values.hygiene.webhookUrl | b64enc | quote }}
  {{- end }}
{{- end }}
